name: D4D4YClient
options:
  bundleIdPrefix: com.d4d4y.client
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0

targets:
  D4D4YClient:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Network
      - Parsers
      - Repositories
      - Core
      - Features
      - Shared
    dependencies:
      - package: SwiftSoup
    testTarget: D4D4YClientTests
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ENABLE_TESTABILITY: YES
        SWIFT_VERSION: "5.9"

  D4D4YClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: D4D4YClient
    settings:
      base:
        SWIFT_VERSION: "5.9"
