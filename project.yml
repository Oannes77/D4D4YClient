name: D4D4YClient
options:
  bundleIdPrefix: com.d4d4y.client
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0

targets:
  D4D4YClient:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Network
      - Parsers
      - Repositories
      - Core
      - Features
      - Shared
      - Demo
    dependencies:
      - package: SwiftSoup
    testTarget: D4D4YClientTests
    settings:
      base:
        # 手写 Info.plist（Support/Info.plist）：后台刷新的 UIBackgroundModes 与
        # BGTaskSchedulerPermittedIdentifiers 是数组，无法用 INFOPLIST_KEY_* 表达。
        # 因此关掉自动生成，改用显式文件；CFBundle* 等键仍由构建设置自动注入。
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_TESTABILITY: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1

  D4D4YClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: D4D4YClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1

  D4D4YClientScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: D4D4YClientScreenshots
    dependencies:
      - target: D4D4YClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
