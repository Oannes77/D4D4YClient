# ============================================================================
#  D4D4YClient — Alpha Build (Phase 1: 仅验证能否编译，不做分发)
#  目标：xcodegen generate → xcodebuild build (Simulator) → 跑 XCTest → 看 build log
#  暂不做：签名 / IPA / TestFlight / 截图 / fastlane snapshot（Phase 2 再开）
#
#  前置：把 D4D4YClient 作为仓库根推到 GitHub，Codemagic 关联仓库即可，
#        本阶段【不需要任何密钥 / 开发者账号】（Simulator build 自动签名到模拟器）
#
#  说明：iOS 17 + Swift 5.9。Codemagic 已移除 Xcode 15.x (2025-11-10 起)，
#        故使用 Xcode 16.2 + iPhone 16 Pro / iOS 18.2。项目仍保持 iOS 17.0 部署目标。
# ============================================================================

workflows:
  alpha-build:
    name: Alpha Build (compile check only)
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: "16.2"
      vars:
        XCODE_PROJECT: D4D4YClient
        XCODE_SCHEME: D4D4YClient
        SIM_NAME: "iPhone 16 Pro"
        SIM_OS: "18.2"

    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project (must succeed first)
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Build for iOS Simulator (compile check)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT.xcodeproj" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=$SIM_OS" \
            -derivedDataPath build/derived

      - name: Run unit tests
        script: |
          set +e
          xcodebuild test \
            -project "$XCODE_PROJECT.xcodeproj" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=$SIM_OS" \
            -derivedDataPath build/derived
          echo "（暂无测试用例时此步失败可忽略；已写测试时请修复）"

    artifacts:
      - build/derived/Build/Products/Debug-iphonesimulator/*.app

  # ----------------------------------------------------------------------------
  #  Phase 1.5 —— 真实 UI 截图（演示模式，无需密钥）
  #  启动参数 -DemoMode 触发 ScreenshotGalleryView + 离线夹具数据；
  #  UI 测试逐 Tab 截 5 个界面，亮/暗各一套，写入 $TMPDIR/screenshots 后收集为 artifact。
  #  入口：在 Codemagic 选择 "Screenshots" workflow 手动触发。
  # ----------------------------------------------------------------------------
  screenshots:
    name: Screenshots (demo mode)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: "16.2"
      vars:
        XCODE_PROJECT: D4D4YClient
        XCODE_SCHEME: D4D4YClientScreenshots
        SIM_NAME: "iPhone 16 Pro"
        SIM_OS: "18.2"
    scripts:
      - name: Install XcodeGen
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate
      - name: Boot simulator (fresh state)
        script: |
          # 重置模拟器状态后再 boot：上轮残留的进程/系统状态偶发导致
          # “The test runner encountered an error”（runner 起不来 → 0 张截图、编译明明成功）。
          xcrun simctl shutdown all || true
          xcrun simctl erase "$SIM_NAME" || true
          xcrun simctl boot "$SIM_NAME" || true
      - name: Build & run screenshot tests
        script: |
          # 注意：UI 测试若部分 Tab 偶发崩溃，仍要让后续 Collect 步骤执行，
          # 以便从 .xcresult 导出已成功截图。故此处不因 test 失败而退出。
          # 完整输出 tee 到日志文件，供 Collect 步骤在 0 张时反查编译错误
          # （否则编译失败被 `|| true` 吞掉，只能下载 1.9MB 大日志才看得出）。
          xcodebuild test \
            -project "$XCODE_PROJECT.xcodeproj" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=$SIM_OS" \
            -derivedDataPath build/screenshots_derived \
            -resultBundlePath "$CM_BUILD_DIR/test.xcresult" 2>&1 | tee "$CM_BUILD_DIR/build_screenshots.log" || true
          echo "（UI 测试结束；部分 Tab 失败时仍继续导出已有截图附件）"
      - name: Collect screenshots
        script: |
          # 从 .xcresult 结果包导出 XCTAttachment 截图（Xcode 自带工具，零额外依赖）。
          # UI 测试在模拟器沙盒内运行，沙盒 $TMPDIR 与 CI runner 不同，
          # 故不依赖临时目录，直接取结果包内的附件。
          mkdir -p "$CM_BUILD_DIR/screenshots"
          xcrun xcresulttool export attachments \
            --path "$CM_BUILD_DIR/test.xcresult" \
            --output-path "$CM_BUILD_DIR/screenshots"
          echo "--- 导出文件清单 (Collect step) ---"
          find "$CM_BUILD_DIR/screenshots" -type f | head -50
          PNG_COUNT=$(find "$CM_BUILD_DIR/screenshots" -name '*.png' | wc -l | tr -d ' ')
          echo "--- png 数量: $PNG_COUNT ---"
          # 防呆：0 张通常是主 App / 测试 target 编译失败导致测试未运行
          # （被上面 `|| true` 静默吞掉）。直接在此打印 error 摘要，免下载大日志。
          if [ "$PNG_COUNT" -eq 0 ]; then
            echo ""
            echo "!!! 警告：未导出任何 png 截图。常见根因是主 App / 测试 target 编译失败，"
            echo "!!! 导致 xcodebuild 并未真正运行 UI 测试（即使上面步骤显示 '完成'）。"
            echo "!!! 本次 build 日志中的 error 摘要如下（若为空则是运行时崩溃，需下载完整日志排查）："
            grep -n "error:" "$CM_BUILD_DIR/build_screenshots.log" 2>/dev/null | head -30 || true
          fi
    artifacts:
      - screenshots/**/*.png
      - screenshots/*.png

    # ==========================================================================
